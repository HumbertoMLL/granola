<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granola · mockups v1 / v2 / v3</title>
<style>
  body{margin:0;background:#eee;font:14px/1.4 system-ui,sans-serif;color:#222}
  header{padding:16px 24px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:2}
  header h1{margin:0;font-size:18px}
  nav{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  nav a{padding:6px 12px;border:1px solid #ccc;border-radius:999px;background:#fafafa;color:#222;text-decoration:none}
  section{padding:24px}
  h2{margin:0 0 12px;font-size:16px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  .col h3{margin:0 0 8px;font-size:13px;color:#555;text-transform:uppercase;letter-spacing:.08em}
  iframe{width:390px;height:780px;border:1px solid #ccc;border-radius:24px;background:#fff;display:block}
  @media (max-width:1240px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Granola · mockups de baja fidelidad</h1>
  <nav>
    <a href="#s1">1 Perfil público</a><a href="#s2">2 Agendar</a><a href="#s3">3 Directorio</a><a href="#s4">4 Agenda nutri</a>
  </nav>
</header>
<script>
  const dirs=[["v1-minimal","v1 · Minimal clínico"],["v2-calido","v2 · Cálido wellness"],["v3-linkinbio","v3 · Link-in-bio"]];
  const screens=[["01-perfil-publico","1. Link-tree / perfil público"],["02-agendar","2. Agendar cita (paciente)"],["03-directorio","3. Directorio de nutriólogas"],["04-agenda-nutri","4. Agenda de la nutrióloga"]];
  document.write(screens.map(([f,t],i)=>`<section id="s${i+1}"><h2>${t}</h2><div class="row">${dirs.map(([d,n])=>`<div class="col"><h3>${n}</h3><iframe src="${d}/${f}.html" loading="lazy"></iframe></div>`).join("")}</div></section>`).join(""));
</script>
</body>
</html>
